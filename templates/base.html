<!doctype html>
<html lang="en" data-theme="lagoon">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf_token }}">
<title>{% block title %}Briefing{% endblock %} | News Scraper</title>
<script nonce="{{ csp_nonce }}">try{var t=localStorage.getItem('ns-theme2');if(!t){t=matchMedia('(prefers-color-scheme: light)').matches?'blush':'lagoon'}document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/big-shoulders-display@5.3.0/index.css" integrity="sha384-IuhvvyZbm1NgB7VMtIPPdoMeKUxntuEZuZGRD7dUbkAHb6lXpyYolkFZcY1iew1j" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/hanken-grotesk@5.3.0/index.css" integrity="sha384-LK4Cy9y5L8rLh+rP5R7d6jLROKH3Hsdtv2AKNiN1JSQukzAXF+m6fdYfuALHo5Bn" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/spline-sans-mono@5.3.0/index.css" integrity="sha384-neVGtQJFr6cUmsllIij9J0fzkozA0TbcPxWyT2U3TVt10ESi1gmUW7Mrccb69OVB" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" integrity="sha384-6p9AefaqUhEVheRlj1mpAkbngHXy9mbYMrIdcIt4Jlc9lOLIablJq3bBsLOjGwZ7" crossorigin="anonymous">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body data-page="{{ page }}">
<header class="top">
  <div class="wrap">
    <a class="brand" href="{{ url_for('home') }}"><b>N</b>News Scraper</a>
    <div class="runstate" id="runstate" data-running="{{ 1 if running else 0 }}">
      <span class="pulse {{ '' if running else 'hide' }}"></span><span class="txt">{{ 'running' if running else 'idle' }}</span>
    </div>
    <div class="themes" role="group" aria-label="Colour theme">
      <button data-t="lagoon" title="Lagoon" aria-label="Lagoon theme"></button>
      <button data-t="blush" title="Blush" aria-label="Blush theme"></button>
      <button data-t="highlighter" title="Highlighter" aria-label="Highlighter theme"></button>
    </div>
    <form method="post" action="{{ url_for('start') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <input type="hidden" name="back" value="{{ request.path }}">
      <button class="btn sm" id="runbtn" {{ 'disabled' if running }}><i class="ph ph-play"></i> Run now</button>
    </form>
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <button class="iconbtn" title="Log out" aria-label="Log out"><i class="ph ph-sign-out"></i></button>
    </form>
  </div>
  <div class="progress" aria-hidden="true"><i id="progfill"></i></div>
</header>
<main class="page">
  <div class="wrap">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash {{ cat }}" role="status">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</main>
<nav class="dock" aria-label="Main">
  <a href="{{ url_for('home') }}" class="{{ 'on' if page == 'home' }}"><i class="ph ph-kanban"></i>Briefing</a>
  <a href="{{ url_for('add') }}" class="{{ 'on' if page == 'add' }}"><i class="ph ph-plus-circle"></i>Add new scraper</a>
  <a href="{{ url_for('manage') }}" class="{{ 'on' if page == 'manage' }}"><i class="ph ph-stack"></i>Sources</a>
  <a href="{{ url_for('runs') }}" class="{{ 'on' if page == 'runs' }}"><i class="ph ph-calendar-dots"></i>History</a>
</nav>
{% block overlays %}{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
